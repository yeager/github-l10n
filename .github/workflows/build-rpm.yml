name: Build RPM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Get version
        id: version
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' src/github_l10n/__init__.py)" >> $GITHUB_OUTPUT

      - name: Setup RPM build
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          VERSION=${{ steps.version.outputs.version }}
          DIR=github-l10n-$VERSION
          mkdir -p $DIR/{github_l10n,data/icons,data/man,po/sv/LC_MESSAGES}
          cp src/github_l10n/*.py $DIR/github_l10n/
          cp data/se.danielnylander.github-l10n.desktop $DIR/data/
          cp data/icons/se.danielnylander.github-l10n.svg $DIR/data/icons/
          cp data/man/github-l10n.1 $DIR/data/man/
          cp LICENSE $DIR/
          [ -f po/sv/LC_MESSAGES/github-l10n.mo ] && cp po/sv/LC_MESSAGES/github-l10n.mo $DIR/po/sv/LC_MESSAGES/
          tar czf ~/rpmbuild/SOURCES/$DIR.tar.gz $DIR

      - name: Create spec file
        run: |
          cat > ~/rpmbuild/SPECS/github-l10n.spec << 'SPEC'
          Name:           github-l10n
          Version:        VERSION_PLACEHOLDER
          Release:        1
          Summary:        GitHub Translation Stats - Scan GitHub repos for missing translations
          License:        GPL-3.0-or-later
          URL:            https://github.com/yeager/github-l10n
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      noarch
          Requires:       python3 >= 3.9
          Requires:       python3-gobject
          Requires:       gtk4
          Requires:       libadwaita

          %description
          A GTK4/Adwaita desktop application that scans GitHub repositories
          for missing translations and shows translation statistics.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}%{_datadir}/github-l10n/github_l10n
          cp github_l10n/*.py %{buildroot}%{_datadir}/github-l10n/github_l10n/

          mkdir -p %{buildroot}%{_bindir}
          cat > %{buildroot}%{_bindir}/github-l10n << 'LAUNCHER'
          #!/bin/bash
          exec python3 -c "import sys; sys.path.insert(0, '/usr/share/github-l10n'); from github_l10n.app import main; main()" "$@"
          LAUNCHER
          chmod 755 %{buildroot}%{_bindir}/github-l10n

          mkdir -p %{buildroot}%{_datadir}/applications
          cp data/se.danielnylander.github-l10n.desktop %{buildroot}%{_datadir}/applications/

          mkdir -p %{buildroot}%{_datadir}/icons/hicolor/scalable/apps
          cp data/icons/se.danielnylander.github-l10n.svg %{buildroot}%{_datadir}/icons/hicolor/scalable/apps/

          mkdir -p %{buildroot}%{_mandir}/man1
          cp data/man/github-l10n.1 %{buildroot}%{_mandir}/man1/

          mkdir -p %{buildroot}%{_datadir}/locale/sv/LC_MESSAGES
          [ -f po/sv/LC_MESSAGES/github-l10n.mo ] && cp po/sv/LC_MESSAGES/github-l10n.mo %{buildroot}%{_datadir}/locale/sv/LC_MESSAGES/

          %files
          %license LICENSE
          %{_bindir}/github-l10n
          %{_datadir}/github-l10n/github_l10n/__init__.py
          %{_datadir}/github-l10n/github_l10n/__main__.py
          %{_datadir}/github-l10n/github_l10n/api.py
          %{_datadir}/github-l10n/github_l10n/app.py
          %{_datadir}/applications/se.danielnylander.github-l10n.desktop
          %{_datadir}/icons/hicolor/scalable/apps/se.danielnylander.github-l10n.svg
          %{_mandir}/man1/github-l10n.1*
          %{_datadir}/locale/sv/LC_MESSAGES/github-l10n.mo
          SPEC
          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/" ~/rpmbuild/SPECS/github-l10n.spec

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/github-l10n.spec

      - name: Upload RPM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload "v$VERSION" \
            ~/rpmbuild/RPMS/noarch/github-l10n-${VERSION}-1.noarch.rpm \
            --clobber
