[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-l10n"
version = "0.2.7"
description = "Scan popular GitHub repos for missing translations"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Daniel Nylander", email = "daniel@danielnylander.se"}]
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.42"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Localization",
]

[project.urls]
Homepage = "https://github.com/yeager/github-l10n"

[project.scripts]
github-l10n = "github_l10n.app:main"

[project.gui-scripts]
github-l10n = "github_l10n.app:main"

[tool.setuptools.packages.find]
where = ["src"]
